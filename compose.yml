  services:
    fs:
      image: episomer-dev
      dns_search: "."
      pull_policy: never
      #restart: on-failure
      build: 
        context: .
        dockerfile: Dockerfile
        additional_contexts:
          src: "."
      ports:
        - "${EPISOMER_FS_PORT}:8080"
      healthcheck:
        # localhost, not http://fs: it needs no DNS and it is the same check a Kubernetes
        # readiness probe makes. It works because EPISOMER_OPTION_FS_URL below is a wildcard,
        # so the API listens on the loopback as well - the two settings go together.
        test: curl --fail http://localhost:8080/ping
        interval: 30s
        timeout: 5s
        retries: 400
        start_period: 10s
      environment:
        EPI_HOME: "/episomer-data"
        EPISOMER_RUN: "FS"
        EPISOMER_INSTANCE: "fs"
        EPISOMER_OPTION_SM_ACTIVATED_BLUESKY: "TRUE"
        EPISOMER_OPTION_SM_ALERTS_BLUESKY: "TRUE"
        EPISOMER_OPTION_SM_ACTIVATED_MASTODON: "FALSE"
        EPISOMER_OPTION_SM_ALERTS_MASTODON: "FALSE"
        EPISOMER_OPTION_MASTODON_INSTANCES: "mastodon.social;mstdn.party"
        # The interface the Scala API binds, not an address anything calls. A wildcard is the
        # one value that works unchanged under Docker and under Kubernetes: a service name
        # resolves to the container IP here and to a ClusterIP there, which a pod does not hold
        # and cannot bind. The R side knows a wildcard is not callable and dials
        # localhost:fs_port instead (get_scala_api_endpoint(), R/fs.R).
        EPISOMER_OPTION_FS_URL: "http://0.0.0.0"
        # Where the *temporary* database of the language model retraining binds (setup(),
        # option 5). Spelled out here rather than left to the defaults because these are the
        # two values a deployment has to know about: 9080 must stay unexposed and unrouted,
        # and the host must stay loopback so nothing outside this container can reach it.
        #
        # Deliberately not the same as EPISOMER_OPTION_FS_URL above. That one has to be as
        # wide as possible - search and detect and the health check all have to reach the real
        # database. This one has to be as narrow as possible: while the retraining runs, search
        # and detect must NOT find a database, or they start collecting against untrained
        # language models. Opposite requirements, so opposite values.
        EPISOMER_OPTION_FS_SETUP_HOST: "localhost"
        EPISOMER_OPTION_FS_SETUP_PORT: 9080
        EPISOMER_KR_PASSWORD_FILE: "/run/secrets/episomer_kr_password"
        # The social media credentials belong to this service and to this one only. search and
        # detect run with EPI_HOST set, which makes fs_remote() true (R/fs.R), and every secret
        # they need is then an HTTP call to the fs API, resolved out of the environment of *this*
        # container by the get_secret.R sub process (scala/src/main/scala/API.scala). Repeating
        # them on search or detect would have no effect at all.
        EPISOMER_SECRET_BLUESKY_USER_FILE: "/run/secrets/episomer_bluesky_user"
        EPISOMER_SECRET_BLUESKY_PASSWORD_FILE: "/run/secrets/episomer_bluesky_password"
        EPISOMER_SECRET_MASTODON_MASTODON_SOCIAL_TOKEN_FILE: "/run/secrets/episomer_mastodon_mastodon_social_token"
        EPISOMER_SECRET_MASTODON_MSTDN_PARTY_TOKEN_FILE: "/run/secrets/episomer_mastodon_mstdn_party_token"
        OPENBLAS_NUM_THREADS: 1
        TMPDIR: "/episomer-data/tmp"
        _JAVA_OPTIONS=-Djava.io.tmpdir: "/episomer-data/tmp"
      secrets:
        - episomer_kr_password
        - episomer_bluesky_user
        - episomer_bluesky_password
        - episomer_mastodon_mastodon_social_token
        - episomer_mastodon_mstdn_party_token
      volumes:
        - ${EPI_HOME}:/episomer-data
    search:
      image: episomer-dev
      dns_search: "."
      pull_policy: never
      restart: on-failure
      depends_on:
        fs:
          condition: service_healthy
      environment:
        EPI_HOST: "http://fs:8080"
        EPI_HOME: "/episomer-data"
        EPISOMER_RUN: "SEARCH"
        EPISOMER_INSTANCE: "search"
        EPISOMER_KR_PASSWORD_FILE: "/run/secrets/episomer_kr_password"
      secrets:
        - episomer_kr_password
      healthcheck:
        test:  R -e "episomer::setup_config();tryCatch(episomer::check_sm_auth(), warning = function(m) stop(m))"
        interval: 40s
        timeout: 30s
        retries: 3
        start_period: 30s
      volumes:
        - ${EPI_HOME}/jobs:/episomer-data/jobs
    detect:
      image: episomer-dev
      dns_search: "."
      pull_policy: never
      restart: on-failure
      depends_on:
        fs:
          condition: service_healthy
      environment:
        EPI_HOST: "http://fs:8080"
        EPI_HOME: "/episomer-data"
        EPISOMER_RUN: "DETECT"
        EPISOMER_INSTANCE: "detect"
        EPISOMER_KR_PASSWORD_FILE: "/run/secrets/episomer_kr_password"
      secrets:
        - episomer_kr_password
      volumes:
        - ${EPI_HOME}/jobs:/episomer-data/jobs
  # The host-side variables feeding these secrets are deliberately named after the variables the
  # application itself reads, EPISOMER_SECRET_<NAME>. Nothing forces it - compose only needs *a*
  # variable here - but the alternative has already cost a deployment: a name like
  # EPISOMER_BLUESKY_USER seen in this file reads like the setting to define, while it is only the
  # value piped into the secret, and the R side never looks at it. See get_env_secrets()
  # (episomer/R/config.R): it collects EPISOMER_SECRET_<NAME> for a value given directly, and
  # EPISOMER_SECRET_<NAME>_FILE for a value read from the first line of a file - the two forms are
  # interchangeable, which is what makes the mounted secrets below equivalent to plain variables on
  # a deployment that has its own secret store.
  secrets:
    episomer_kr_password:
      environment: EPISOMER_KR_PASSWORD
    episomer_bluesky_user:
      environment: EPISOMER_SECRET_BLUESKY_USER
    episomer_bluesky_password:
      environment: EPISOMER_SECRET_BLUESKY_PASSWORD
    episomer_mastodon_mastodon_social_token:
      environment: EPISOMER_SECRET_MASTODON_MASTODON_SOCIAL_TOKEN
    episomer_mastodon_mstdn_party_token:
      environment: EPISOMER_SECRET_MASTODON_MSTDN_PARTY_TOKEN   